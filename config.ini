[General]
Name = 手柄自定义功能插件
Description = 支持自定义手柄地图快捷键和专用灵敏度系数
Developer = 风间千雪
File = GamepadCustomPlugin.dll
Version = 1.1.0
GameVersion = 7.1

[MapBinding]
Name = 启用地图快捷键
Type = bool
Value = 1

[MapButton]
Name = 自定义地图快捷键
Type = enum
OptionsSource = gamepad
Value = View

[GamepadSensitivityMultiplier]
Name = 手柄镜头灵敏度系数（1.0为原速）
Type = string
Value = 1.0

[DualSenseEdgeView]
Name = DualSense Edge 兼容视图
Type = bool
Value = 1
