[General]
Name = 手柄自定义功能插件
Description = 支持自定义地图快捷键、专用灵敏度系数和全局热切换
Developer = 风间千雪
File = GamepadCustomPlugin.dll
Version = 1.2.0
GameVersion = 7.2

[MapBinding]
Name = 启用地图快捷键
Type = bool
Value = 1

[MapButton]
Name = 自定义地图快捷键
Type = enum
OptionsSource = gamepad
Value = View

[GamepadSensitivityMultiplier]
Name = 手柄镜头灵敏度系数（1.0为原速）
Type = string
Value = 1.0

[DualSenseEdgeView]
Name = DualSense Edge 兼容视图
Type = bool
Value = 1

[GlobalInputSwitch]
Name = 全局手柄与键鼠热切换
Type = bool
Value = 0

[GamepadUseKeyboardScale]
Name = 手柄界面使用键鼠缩放
Type = bool
Value = 0
